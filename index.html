<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Memo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="src/styles.css">
  <title>Memo</title>
</head>
<body>
  <div id="app" data-view="tree">
    <aside class="pane sidebar" aria-label="페이지">
      <header class="bar side-head">
        <span class="workspace"><span class="ws-badge">M</span><span class="ws-name">Memo</span></span>
        <button class="icon-btn" id="btn-settings" aria-label="설정" title="설정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button class="icon-btn accent" id="btn-new-page" aria-label="새 페이지" title="새 페이지">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        </button>
      </header>
      <div class="search-wrap"><input id="search" type="search" placeholder="검색" autocomplete="off"></div>
      <nav id="tree" class="list tree" aria-label="페이지 목록"></nav>
      <footer class="side-foot">
        <button class="text-btn" id="btn-new-folder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>새 섹션
        </button>
        <button class="text-btn" id="btn-trash">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>휴지통
        </button>
        <button class="sync-status" id="sync-status" type="button"></button>
      </footer>
    </aside>

    <main class="pane pane-editor" aria-label="페이지 편집">
      <header class="bar page-bar">
        <button class="back-btn" id="btn-back" aria-label="뒤로">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <nav id="crumbs" class="crumbs" aria-label="경로"></nav>
        <button class="icon-btn" id="btn-note-menu" aria-label="페이지 메뉴" title="페이지 메뉴" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
      </header>
      <div id="trash-banner" class="trash-banner" hidden>휴지통에 있는 페이지입니다. <button id="btn-restore" class="link-btn" type="button">복구</button></div>
      <div class="editor-wrap" id="editor-wrap">
        <div id="empty-editor" class="empty">왼쪽에서 페이지를 고르거나 새로 만드세요</div>
        <div id="cover" class="cover" hidden>
          <div class="cover-actions">
            <button type="button" id="btn-cover-change">커버 변경</button>
            <button type="button" id="btn-cover-remove">제거</button>
          </div>
        </div>
        <article id="editor" class="editor" hidden>
          <div class="page-head">
            <button type="button" id="page-icon" class="page-icon" aria-label="아이콘 바꾸기" hidden></button>
            <div class="page-actions">
              <button type="button" id="btn-add-icon">☺ 아이콘 추가</button>
              <button type="button" id="btn-add-cover">▨ 커버 추가</button>
            </div>
          </div>
          <input id="note-title" class="note-title" placeholder="제목 없음" autocomplete="off" enterkeyhint="next">
          <div id="note-meta" class="note-meta"></div>
          <div id="blocks" class="blocks"></div>
        </article>
      </div>
      <div id="toolbar" class="toolbar" hidden></div>
    </main>
  </div>
  <div id="overlay-root"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
